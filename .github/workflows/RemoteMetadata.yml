#
# Validates OpenIVM metadata stored in a remote PostgreSQL catalog (issue #84) against a
# disposable PostgreSQL service container. No external or managed database is contacted.
#
name: Remote Metadata Integration
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  remote-metadata:
    name: OpenIVM metadata in PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openivm
          POSTGRES_PASSWORD: openivm
          POSTGRES_DB: openivm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openivm -d openivm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GEN: ninja
      OPENIVM_POSTGRES_DSN: host=localhost port=5432 user=openivm password=openivm dbname=openivm_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Build
        run: make release

      # The test installs postgres, ducklake and sqlite from the DuckDB extension repository. A new DuckDB release
      # has no published builds until the extensions are rebuilt against it, so skip rather than fail until then.
      - name: Check extension builds are published
        id: extensions
        run: |
          source_id=$(./build/release/duckdb -csv -noheader -c "SELECT source_id FROM pragma_version()")
          missing=""
          for extension in postgres_scanner ducklake sqlite_scanner; do
            url="http://extensions.duckdb.org/${source_id}/linux_amd64/${extension}.duckdb_extension.gz"
            if ! curl -fsI "$url" > /dev/null; then
              missing="$missing $extension"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Skipping remote metadata test: no build for DuckDB ${source_id} of:${missing}"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remote metadata integration test
        if: steps.extensions.outputs.available == 'true'
        run: python3 test/integration/test_remote_metadata.py ./build/release/duckdb --require
